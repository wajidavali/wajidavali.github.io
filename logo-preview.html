<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silixus Logo Preview</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: #eef3ff;
        color: #0f172a;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }
      h1 {
        text-align: center;
        margin-bottom: 12px;
      }
      .subtitle {
        text-align: center;
        color: #4b5563;
        margin-bottom: 32px;
      }
      .panel {
        margin-bottom: 26px;
        border-radius: 20px;
        padding: 28px;
        border: 1px solid rgba(15,23,42,0.08);
        background: white;
        box-shadow: 0 16px 28px rgba(15,23,42,0.04);
      }
      .dark {
        background: linear-gradient(135deg, #0b1020, #111827);
      }
      .dark img {
        background: transparent;
      }
      .logo-box {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 220px;
      }
      img {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Silixus Final Logo</h1>
      <p class="subtitle">Standard enterprise-style logo for software, AI, and DevOps branding</p>

      <div class="panel">
        <div class="logo-box">
          <img src="assets/logos/silixus-enterprise-logo.svg" alt="Silixus enterprise logo" />
        </div>
      </div>

      <div class="panel dark">
        <div class="logo-box">
          <img src="assets/logos/silixus-enterprise-logo.svg" alt="Silixus enterprise logo on dark background" />
        </div>
      </div>
    </div>
  </body>
</html>
